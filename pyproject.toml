[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange-market-maker-reporter"
version = "0.1.0"
description = "Extract ETF/listed-fund market-making events from SSE and SZSE disclosures."
requires-python = ">=3.10"
dependencies = [
  "lxml>=5.0",
  "pypdf>=5.0",
]

[project.optional-dependencies]
ocr = [
  "PyMuPDF>=1.24",
  "rapidocr-onnxruntime>=1.3",
]

[project.scripts]
market-maker-report = "market_maker_tool.cli:main"

[tool.setuptools]
packages = ["market_maker_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
