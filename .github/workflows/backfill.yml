name: Three-month backfill

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backfill.yml"
  workflow_dispatch:
    inputs:
      date_from:
        description: "开始日期（YYYY-MM-DD）；留空则从北京时间昨天往前 3 个月"
        required: false
        type: string
      date_to:
        description: "结束日期（YYYY-MM-DD）；留空则为北京时间昨天"
        required: false
        type: string

concurrency:
  group: daily-report
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      date_from: ${{ steps.range.outputs.date_from }}
      date_to: ${{ steps.range.outputs.date_to }}
      failed_count: ${{ steps.backfill.outputs.failed_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Validate
        run: python -m unittest discover -s tests -q
      - name: Resolve backfill range
        id: range
        env:
          REQUESTED_FROM: ${{ inputs.date_from }}
          REQUESTED_TO: ${{ inputs.date_to }}
        run: |
          DATE_TO="${REQUESTED_TO:-$(TZ=Asia/Shanghai date -d yesterday +%F)}"
          date -d "$DATE_TO" +%F >/dev/null
          DATE_FROM="${REQUESTED_FROM:-$(date -d "$DATE_TO -3 months +1 day" +%F)}"
          date -d "$DATE_FROM" +%F >/dev/null

          if [ "$DATE_FROM" \> "$DATE_TO" ]; then
            echo "::error::Start date $DATE_FROM is later than end date $DATE_TO."
            exit 1
          fi

          DAYS="$(( ($(date -d "$DATE_TO" +%s) - $(date -d "$DATE_FROM" +%s)) / 86400 + 1 ))"
          if [ "$DAYS" -gt 100 ]; then
            echo "::error::Backfill range has $DAYS days; the maximum is 100."
            exit 1
          fi

          echo "date_from=$DATE_FROM" >> "$GITHUB_OUTPUT"
          echo "date_to=$DATE_TO" >> "$GITHUB_OUTPUT"
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "Backfill range: $DATE_FROM through $DATE_TO ($DAYS days)"
      - name: Create runtime configuration
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          if [ -z "$APP_CONFIG_JSON" ]; then
            echo "::error::Repository secret APP_CONFIG_JSON is not configured."
            exit 1
          fi
          printf '%s' "$APP_CONFIG_JSON" > config.json
          python -c "import json; json.load(open('config.json', encoding='utf-8'))"
      - name: Run daily backfill
        id: backfill
        env:
          DATE_FROM: ${{ steps.range.outputs.date_from }}
          DATE_TO: ${{ steps.range.outputs.date_to }}
        run: |
          RESULT_DIR="$RUNNER_TEMP/backfill-results"
          SUCCESS_DIR="$RUNNER_TEMP/backfill-success"
          mkdir -p "$RESULT_DIR" "$SUCCESS_DIR"
          : > "$RESULT_DIR/successful-dates.txt"
          : > "$RESULT_DIR/failed-dates.txt"

          CURRENT_DATE="$DATE_FROM"
          SUCCESS_COUNT=0
          FAILED_COUNT=0
          while [ "$CURRENT_DATE" != "$(date -d "$DATE_TO +1 day" +%F)" ]; do
            echo "::group::Backfill $CURRENT_DATE"
            if python -m market_maker_tool run --date "$CURRENT_DATE"; then
              REPORT="reports/market_making_report_$CURRENT_DATE.csv"
              if [ -f "$REPORT" ]; then
                cp "$REPORT" "$SUCCESS_DIR/"
                echo "$CURRENT_DATE" >> "$RESULT_DIR/successful-dates.txt"
                SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
              else
                echo "::error::The command succeeded but $REPORT was not created."
                echo "$CURRENT_DATE" >> "$RESULT_DIR/failed-dates.txt"
                FAILED_COUNT=$((FAILED_COUNT + 1))
              fi
            else
              echo "$CURRENT_DATE" >> "$RESULT_DIR/failed-dates.txt"
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
            echo "::endgroup::"
            CURRENT_DATE="$(date -d "$CURRENT_DATE +1 day" +%F)"
          done

          git restore --worktree reports
          git clean -f -- reports/market_making_report_*.csv
          if compgen -G "$SUCCESS_DIR/*.csv" > /dev/null; then
            cp "$SUCCESS_DIR"/*.csv reports/
          fi
          python scripts/build_report_index.py

          echo "successful_count=$SUCCESS_COUNT" >> "$GITHUB_OUTPUT"
          echo "failed_count=$FAILED_COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "## Three-month backfill"
            echo
            echo "- Range: \`$DATE_FROM\` through \`$DATE_TO\`"
            echo "- Successful dates: $SUCCESS_COUNT"
            echo "- Failed dates: $FAILED_COUNT"
            if [ "$FAILED_COUNT" -gt 0 ]; then
              echo
              echo "### Failed dates"
              sed 's/^/- `/' "$RESULT_DIR/failed-dates.txt" | sed 's/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit successful reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/*.csv reports/index.json
          if git diff --cached --quiet; then
            echo "Reports are unchanged."
          else
            git commit -m "report: backfill ${{ steps.range.outputs.date_from }} to ${{ steps.range.outputs.date_to }}"
            git push
          fi
      - name: Prepare Pages files
        run: |
          mkdir -p _site/reports
          cp -R site/. _site/
          cp reports/*.csv reports/index.json _site/reports/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Upload backfill summary
        if: always() && steps.backfill.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: backfill-${{ steps.range.outputs.date_from }}-${{ steps.range.outputs.date_to }}
          path: |
            ${{ runner.temp }}/backfill-results/
            logs/
            data/app.db
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs:
      - collect
      - deploy
    if: always() && needs.collect.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check failed dates
        env:
          FAILED_COUNT: ${{ needs.collect.outputs.failed_count }}
        run: |
          if [ "$FAILED_COUNT" -gt 0 ]; then
            echo "::error::$FAILED_COUNT dates failed. Download the backfill artifact for the date list and diagnostics."
            exit 1
          fi
          echo "All dates completed successfully."
